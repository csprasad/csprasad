name: Update README cards

on:
  schedule:
    # Runs at 06:00 UTC on Monday, Wednesday, and Friday
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # Matches requirements: Gotham theme, icons, no stars/contribs, no border
          options: username=${{ github.repository_owner }}&show_icons=true&theme=gotham&hide=stars,contribs&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          # Layout compact to save space in the README
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=gotham&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Featured Repo Pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=SwiftUI-Animations&theme=gotham&hide_border=true
          path: profile/pin-animations.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p profile
          git add profile/*.svg
          # Only commit if the SVG content actually changed to avoid empty commits
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README cards" && git push)
